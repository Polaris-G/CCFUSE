# DroneVehicle (RGB-IR), converted by tools/prepare_dronevehicle.py
# 640x512 crops (100 px white border removed), HBB from OBB, IR annotations on both sides.
# Training validates on the official val split; use DroneVehicle_test.yaml to report test results.

train_rgb: D:/CCSFuse/datasets/DroneVehicle/rgb/images/train
val_rgb: D:/CCSFuse/datasets/DroneVehicle/rgb/images/val
train_ir: D:/CCSFuse/datasets/DroneVehicle/ir/images/train
val_ir: D:/CCSFuse/datasets/DroneVehicle/ir/images/val

# number of classes
nc: 5

# class names (order of paper Table I)
names: ['car', 'truck', 'freight car', 'bus', 'van']
